<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Security Terminal - Escape Room Lock Screen</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    
    /* Shake animation for incorrect password */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-10px); }
      40%, 80% { transform: translateX(10px); }
    }
    .animate-shake {
      animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
    }

    /* Glow animation for unlock state */
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 25px rgba(34, 197, 94, 0.2); }
      50% { box-shadow: 0 0 40px rgba(34, 197, 94, 0.4); }
    }
    .unlocked-glow {
      animation: pulseGlow 3s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-zinc-950 text-slate-100 min-h-screen flex items-center justify-center p-0 md:p-4 selection:bg-indigo-500 selection:text-white">

  <!-- Mobile Device Outer Container -->
  <div class="w-full max-w-md h-[100dvh] md:h-[840px] bg-zinc-900 md:rounded-[48px] border-0 md:border-[8px] border-zinc-800 shadow-2xl flex flex-col justify-between overflow-hidden relative">

    <!-- Top Status Bar Simulation -->
    <div class="w-full px-6 pt-3 pb-2 flex justify-between items-center text-xs text-zinc-400 select-none z-20">
      <span id="status-bar-time" class="font-semibold tracking-tight">12:00</span>
      <!-- Speaker Notch (Desktop View Only) -->
      <div class="hidden md:block w-20 h-4 bg-zinc-950 rounded-full mx-auto -mt-2 shadow-inner"></div>
      <div class="flex items-center space-x-2">
        <i class="fa-solid font-bold fa-signal text-[10px]"></i>
        <i class="fa-solid fa-wifi text-[10px]"></i>
        <i class="fa-solid fa-battery-three-quarters text-xs"></i>
      </div>
    </div>

    <!-- MAIN CONTENT VIEW -->
    <main class="flex-1 flex flex-col justify-between p-6 z-10 relative overflow-y-auto">

      <!-- LOCK SCREEN VIEW -->
      <div id="lock-screen" class="flex-1 flex flex-col justify-between transition-all duration-500 opacity-100">
        
        <!-- Header: Clock & Lock Icon -->
        <div class="text-center mt-6 flex flex-col items-center">
          <div id="lock-icon" class="w-12 h-12 rounded-full bg-zinc-800/80 border border-zinc-700/50 flex items-center justify-center mb-4 text-zinc-400 transition-colors duration-300">
            <i class="fa-solid fa-lock text-lg"></i>
          </div>
          <h1 id="clock-time" class="text-6xl font-extralight tracking-tight text-white mb-1">12:00</h1>
          <p id="clock-date" class="text-sm font-medium text-zinc-400 uppercase tracking-widest">Thursday, October 15</p>
        </div>

        <!-- Middle: Form Input Area -->
        <div class="w-full my-auto py-6">
          <form id="passcode-form" onsubmit="handleFormSubmit(event)" class="flex flex-col items-center">
            <label for="passcode-input" class="text-xs uppercase tracking-wider text-zinc-400 mb-3 font-semibold flex items-center gap-1.5">
              <i class="fa-solid fa-shield-halved text-indigo-400"></i> Enter Security Phrase
            </label>

            <div id="input-container" class="w-full max-w-xs relative mb-3 transition-transform duration-200">
              <input 
                type="text" 
                id="passcode-input" 
                autocomplete="off" 
                autocorrect="off" 
                autocapitalize="off" 
                spellcheck="false"
                placeholder="Touch to enter phrase..."
                class="w-full bg-zinc-800/90 text-white placeholder-zinc-500 border border-zinc-700/80 rounded-2xl px-4 py-3.5 text-center text-lg font-medium focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 shadow-inner transition-all duration-200"
              >
            </div>

            <!-- Error Feedback Message -->
            <div id="error-message" class="h-6 text-rose-400 text-xs font-medium flex items-center justify-center opacity-0 transition-opacity duration-200">
              <i class="fa-solid fa-circle-exclamation mr-1.5"></i> Access Denied: Incorrect Phrase
            </div>

            <!-- Submit Button -->
            <button 
              type="submit" 
              id="submit-btn"
              class="w-full max-w-xs mt-2 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 active:scale-95 text-white font-semibold py-3.5 px-6 rounded-2xl shadow-lg shadow-indigo-900/30 flex items-center justify-center space-x-2 transition-all duration-150"
            >
              <span>UNLOCKED TERMINAL</span>
              <i class="fa-solid fa-arrow-right text-sm"></i>
            </button>
          </form>
        </div>

        <!-- Footer Hint / Instruction -->
        <div class="text-center mb-2">
          <p class="text-xs text-zinc-500">Restricted System &bull; Escape Room Terminal</p>
        </div>
      </div>

      <!-- UNLOCKED CLUE VIEW (Hidden by default) -->
      <div id="unlocked-screen" class="hidden flex-1 flex-col items-center justify-between transition-all duration-500 opacity-0 transform translate-y-4">
        
        <!-- Top Banner -->
        <div class="text-center mt-2 w-full">
          <div class="inline-flex items-center gap-2 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 px-4 py-1.5 rounded-full text-xs font-semibold uppercase tracking-wider mb-2">
            <i class="fa-solid fa-lock-open"></i> Access Granted
          </div>
          <h2 class="text-xl font-bold text-white tracking-tight">Decryption Successful</h2>
          <p class="text-xs text-zinc-400 mt-0.5">Found confidential clue payload below</p>
        </div>

        <!-- Clue Image Container -->
        <div class="w-full my-auto flex flex-col items-center justify-center py-4">
          <div class="w-full bg-zinc-800/80 border border-zinc-700/60 rounded-2xl p-3 shadow-2xl unlocked-glow overflow-hidden">
            
            <!-- Replace 'src' with your actual clue image file path (e.g. "clue.jpg") -->
            <img 
              id="clue-image" 
              src="hatespeech.jpg" 
              alt="Secret Escape Room Clue"
              class="w-full h-auto max-h-[380px] object-contain rounded-xl bg-zinc-950"
              onerror="this.onerror=null; this.src='https://placehold.co/600x800/1e293b/ef4444?text=Image+Load+Error%0AEnsure+clue.jpg+is+uploaded';"
            />

          </div>
          <p class="text-[11px] text-zinc-500 mt-3 text-center italic">
            <i class="fa-solid fa-triangle-exclamation mr-1"></i> Document payload decrypted. Take notes before leaving.
          </p>
        </div>

        <!-- Lock Again Button -->
        <button 
          onclick="resetTerminal()" 
          class="w-full max-w-xs mb-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-medium py-3 px-4 rounded-xl text-xs flex items-center justify-center space-x-2 border border-zinc-700/50 transition-colors"
        >
          <i class="fa-solid fa-arrows-rotate"></i>
          <span>Relock Terminal</span>
        </button>

      </div>

    </main>

    <!-- Simulated Phone Home Indicator Bar -->
    <div class="w-full py-2 flex justify-center items-center z-20">
      <div class="w-32 h-1 bg-zinc-600/50 rounded-full"></div>
    </div>

  </div>

  <script>
    // =========================================================================
    // CONFIGURATION: Set your escape room secret password here!
    // (Case-insensitive matching is enabled by default)
    // =========================================================================
    const CORRECT_PASSPHRASE = "stop hating me"; // Change this phrase to your clue answer

    // DOM Elements
    const lockScreen = document.getElementById('lock-screen');
    const unlockedScreen = document.getElementById('unlocked-screen');
    const passcodeForm = document.getElementById('passcode-form');
    const passcodeInput = document.getElementById('passcode-input');
    const inputContainer = document.getElementById('input-container');
    const errorMessage = document.getElementById('error-message');
    const lockIcon = document.getElementById('lock-icon');

    // Real-time Clock Functionality
    function updateClock() {
      const now = new Date();
      
      // Hours & Minutes
      let hours = now.getHours();
      let minutes = now.getMinutes();
      hours = hours < 10 ? '0' + hours : hours;
      minutes = minutes < 10 ? '0' + minutes : minutes;
      
      const timeString = `${hours}:${minutes}`;
      document.getElementById('clock-time').innerText = timeString;
      document.getElementById('status-bar-time').innerText = timeString;

      // Date String
      const options = { weekday: 'long', month: 'long', day: 'numeric' };
      document.getElementById('clock-date').innerText = now.toLocaleDateString('en-US', options);
    }
    
    // Update clock every second
    setInterval(updateClock, 1000);
    updateClock();

    // Form Submission Handler
    function handleFormSubmit(e) {
      e.preventDefault();
      
      const userEntry = passcodeInput.value.trim().toLowerCase();
      const targetPhrase = CORRECT_PASSPHRASE.trim().toLowerCase();

      if (userEntry === targetPhrase) {
        unlockTerminal();
      } else {
        triggerError();
      }
    }

    // Trigger Error Animation & Feedback
    function triggerError() {
      // Shake animation
      inputContainer.classList.remove('animate-shake');
      void inputContainer.offsetWidth; // Force reflow
      inputContainer.classList.add('animate-shake');

      // Highlight input border in red
      passcodeInput.classList.add('border-rose-500', 'ring-2', 'ring-rose-500/20');
      
      // Show error text
      errorMessage.classList.remove('opacity-0');
      errorMessage.classList.add('opacity-100');

      // Clear input & focus
      passcodeInput.value = '';
      passcodeInput.focus();

      // Reset error styling after 2 seconds
      setTimeout(() => {
        errorMessage.classList.remove('opacity-100');
        errorMessage.classList.add('opacity-0');
        passcodeInput.classList.remove('border-rose-500', 'ring-2', 'ring-rose-500/20');
      }, 2000);
    }

    // Unlock Screen Transition
    function unlockTerminal() {
      // Blur keyboard on mobile devices
      passcodeInput.blur();

      // Visual success state on lock icon
      lockIcon.classList.remove('bg-zinc-800/80', 'text-zinc-400');
      lockIcon.classList.add('bg-emerald-500/20', 'text-emerald-400', 'border-emerald-500/50');
      lockIcon.innerHTML = '<i class="fa-solid fa-lock-open text-lg"></i>';

      // Smooth transition between screens
      lockScreen.classList.remove('opacity-100');
      lockScreen.classList.add('opacity-0');

      setTimeout(() => {
        lockScreen.classList.add('hidden');
        unlockedScreen.classList.remove('hidden');
        
        // Force reflow for fade-in
        void unlockedScreen.offsetWidth;
        
        unlockedScreen.classList.remove('opacity-0', 'translate-y-4');
        unlockedScreen.classList.add('opacity-100', 'translate-y-0');
      }, 400);
    }

    // Reset back to Lock Screen
    function resetTerminal() {
      unlockedScreen.classList.remove('opacity-100', 'translate-y-0');
      unlockedScreen.classList.add('opacity-0', 'translate-y-4');

      setTimeout(() => {
        unlockedScreen.classList.add('hidden');
        lockScreen.classList.remove('hidden');

        // Reset lock icon
        lockIcon.classList.remove('bg-emerald-500/20', 'text-emerald-400', 'border-emerald-500/50');
        lockIcon.classList.add('bg-zinc-800/80', 'text-zinc-400');
        lockIcon.innerHTML = '<i class="fa-solid fa-lock text-lg"></i>';

        // Clear input form
        passcodeInput.value = '';

        // Force reflow
        void lockScreen.offsetWidth;

        lockScreen.classList.remove('opacity-0');
        lockScreen.classList.add('opacity-100');
      }, 400);
    }
  </script>
</body>
</html>
